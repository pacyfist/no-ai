<main class="bg-base-200 min-h-screen">
  <div class="mx-auto w-full max-w-3xl px-4 py-16">
    <h1 class="mb-6 text-4xl font-bold tracking-tight">&#64;pacyfist/no-ai</h1>

    <!-- Describes the specimen; never reproduces it. A readable copy would sit
         in the served HTML for a scraper to take. -->
    <p class="sr-only">
      A specimen of protected text follows. It is stored scrambled and repaired on screen by a
      generated font, so it is deliberately unreadable here.
    </p>

    <p class="protected-body leading-relaxed" aria-hidden="true" noAi>
      This paragraph is stored in the DOM as a substitution cipher and repaired on screen by a font
      built in your browser at page load.
    </p>
  </div>
</main>
